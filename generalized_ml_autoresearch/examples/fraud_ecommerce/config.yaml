# Fraud ecommerce — binary classification on the FDB unsaturated benchmark
# Best published baseline (FDB paper, Grover et al. 2023): AUC-ROC = 0.636 (AFD TFI)
# Most other AutoML systems hover at 0.515-0.522 (near random), so this is the most
# unsaturated dataset in the Amazon Science Fraud Dataset Benchmark.
paths:
  results_dir: "C:/Users/abhir/clauderesearch/autoresearch/generalized_ml_autoresearch/examples/fraud_ecommerce/autoresearch_results"

task_type: binary_classification
primary_metric: auc_roc

backbone: xgboost
backbone_config:
  n_estimators: 600
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.85
  colsample_bytree: 0.85
  reg_lambda: 1.0
  min_child_weight: 5
  seed: 0
  early_stopping_rounds: 40
  n_jobs: 4

data:
  format: csv
  path: "C:/Users/abhir/clauderesearch/autoresearch/generalized_ml_autoresearch/examples/fraud_ecommerce/data/features.csv"
  target_columns: [class]
  feature_columns: null

split:
  name: stratified_kfold
  n_splits: 3
  seed: 0
  val_fraction_of_train: 0.15

composite:
  higher_is_better: true
  penalty_weight: 0.05
  below_threshold: 0.55

description: "XGBoost baseline on FDB unsaturated benchmark (fraudecom, AUC ceiling 0.636)"
seed: 0
