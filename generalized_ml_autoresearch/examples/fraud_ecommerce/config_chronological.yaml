# Fraud ecommerce — chronological 80/20 holdout split (mirrors FDB exactly)
# Same dataset and same XGBoost config as Exp 1; only the split protocol changes.
# This isolates the in-distribution (Exp 1, stratified CV) vs out-of-time (Exp 2,
# chronological) gap. Comparable apples-to-apples to the FDB published 0.636 ceiling.
paths:
  results_dir: "C:/Users/abhir/clauderesearch/autoresearch/generalized_ml_autoresearch/examples/fraud_ecommerce/autoresearch_results"

task_type: binary_classification
primary_metric: auc_roc

backbone: xgboost
backbone_config:
  n_estimators: 600
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.85
  colsample_bytree: 0.85
  reg_lambda: 1.0
  min_child_weight: 5
  seed: 0
  early_stopping_rounds: 40
  n_jobs: 4

data:
  format: csv
  path: "C:/Users/abhir/clauderesearch/autoresearch/generalized_ml_autoresearch/examples/fraud_ecommerce/data/features.csv"
  target_columns: [class]
  feature_columns: null

split:
  name: holdout
  order: time
  test_fraction: 0.2
  val_fraction: 0.1
  seed: 0

composite:
  higher_is_better: true
  penalty_weight: 0.05
  below_threshold: 0.55

description: "XGBoost — chronological 80/20 holdout (FDB-comparable; ceiling 0.636)"
seed: 0
