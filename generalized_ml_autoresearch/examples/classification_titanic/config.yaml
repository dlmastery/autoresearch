# Titanic — binary classification example (synthetic surrogate to avoid any network dependency)
# Uses sklearn.datasets.load_breast_cancer as a stable, bundled binary-classification stand-in
# for the Titanic survival prediction problem. The feature semantics differ, but the protocol
# (binary-classification with F1 composite, stratified k-fold) is identical to a Titanic run.
paths:
  results_dir: "C:/Users/evija/autoresearch/generalized_ml_autoresearch/examples/classification_titanic/autoresearch_results"

task_type: binary_classification
primary_metric: f1

backbone: xgboost
backbone_config:
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 1.0
  seed: 0
  early_stopping_rounds: 30

data:
  format: sklearn
  loader: load_breast_cancer
  target_columns: [target]
  feature_columns: null

split:
  name: stratified_kfold
  n_splits: 3
  seed: 0
  val_fraction_of_train: 0.15

composite:
  higher_is_better: true
  penalty_weight: 0.1
  below_threshold: 0.85

description: "XGBoost baseline on binary-classification surrogate for Titanic"
seed: 0
